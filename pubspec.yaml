name: fitness_tracker
description: "健身饮食追踪 App - 追踪运动消耗和饮食摄入"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.6.1
  
  # 数据库
  path_provider: ^2.1.5
  path: ^1.9.0
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.28
  
  # 图表
  fl_chart: ^0.70.2
  
  # 工具
  intl: ^0.19.0
  image_picker: ^1.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/foods/
